<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show All Ratings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="/ratings">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/ratings/new">New</a>
            </li>
        </ul>
    </nav>
    <main class="container">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Role</th>
                    <th scope="col">Clarity</th>
                    <th scope="col">Niceness</th>
                    <th scope="col">Knowledgeability</th>
                    <th scope="col">Comment</th>
                    <th scope="col">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${rating}">
                    <td th:text="${r?.name}">No name available</td>
                    <td th:text="${r?.email}">No email available</td>
                    <td th:text="${r?.roleType}"></td>
                    <td th:text="${r?.clarity}"></td>
                    <td th:text="${r?.niceness}"></td>
                    <td th:text="${r?.knowledgeability}"></td>
                    <td th:text="${r?.comment}"></td>
                    <td>
                        <a class="btn btn-primary" th:href="@{/ratings/{id}/edit(id=${r.id})}">Edit</a>
                        <form th:action="@{/ratings/{id}/delete(id=${r.id})}" method="post"
                            onsubmit="return confirm('Are you sure you want to delete this rating?');">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>

</html>
